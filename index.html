<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#e07819"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wooden Station</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);--bg:#f4f5f7;--card:#fff;--tx:#1b1e24;--mu:#6b7280;--pr:#3b5bdb;--ok:#2f9e44;--wa:#e8590c;--bd:#e3e6ea}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161a;--card:#1e2128;--tx:#eceef2;--mu:#98a1b0;--pr:#7c93ff;--ok:#51cf66;--wa:#ff922b;--bd:#2c313a}}
:root[data-theme="dark"]{--bg:#14161a;--card:#1e2128;--tx:#eceef2;--mu:#98a1b0;--pr:#7c93ff;--ok:#51cf66;--wa:#ff922b;--bd:#2c313a}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{padding:14px 14px 100px;max-width:560px;margin:0 auto}
h1{font-size:20px;margin:4px 0 12px}h2{font-size:15px;margin:18px 0 8px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat b{display:block;font-size:26px}.stat span{color:var(--mu);font-size:13px}
input,select,textarea{width:100%;font:inherit;padding:13px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);margin:4px 0 12px}
label{font-size:13px;color:var(--mu)}
button{font:inherit;border:0;border-radius:12px;padding:13px 16px;background:var(--pr);color:#fff;font-weight:600}
button.s{background:var(--bd);color:var(--tx)}button.ok{background:var(--ok)}button.d{background:#e03131}button.sm{padding:8px 12px;font-size:14px}
button.big{width:100%;font-size:17px;padding:16px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 12px}
.chip{padding:11px 12px;border-radius:12px;border:2px solid var(--bd);background:var(--card);color:var(--tx);font-size:14px}
.chip.on{border-color:var(--pr);background:var(--pr);color:#fff}.chip.off{opacity:.35}
.tag{font-size:12px;padding:3px 8px;border-radius:99px;font-weight:700;color:#fff}.R{background:var(--wa)}.Y{background:var(--ok)}.bk{background:var(--pr)}
.mu{color:var(--mu);font-size:13px}.nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.nav button{flex:1;background:none;color:var(--mu);font-size:12px;padding:8px 0}.nav button.a{color:var(--pr)}.nav span{display:block;font-size:22px}
#ov:empty{display:none}#ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9;display:flex;align-items:center;justify-content:center;padding:20px}.mb{background:var(--card);border-radius:16px;padding:18px;width:100%;max-width:360px}.mb p{margin:0 0 14px}

:root{--bg:#fbe9d3;--card:#fff;--tx:#17120d;--mu:#7a6a5a;--pr:#e07819;--bd:#efd8bb;--ok:#2f9e44;--wa:#c2410c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f0d0b;--card:#1b1815;--tx:#f3ece4;--mu:#a89888;--bd:#2e2822;--pr:#e07819;--wa:#ff8a3d}}
:root[data-theme="dark"]{--bg:#0f0d0b;--card:#1b1815;--tx:#f3ece4;--mu:#a89888;--bd:#2e2822;--pr:#e07819;--wa:#ff8a3d}
button{color:#17120d;transition:transform .12s}button:active{transform:scale(.95)}button.d,button.ok{color:#fff}button.s{color:var(--tx)}.chip.on{color:#17120d}
.nav{background:#17120d;border-color:#000}.nav button{color:#b9a998}.nav button.a{color:#e07819}.nav button.a span{animation:bob .5s}
.hd{display:flex;align-items:center;gap:10px;background:#e07819;padding:8px 14px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;color:#17120d;border-bottom:3px solid #17120d}
.hd img{height:42px;width:42px;border-radius:10px}.hd b{font-size:18px;letter-spacing:.08em;display:block}.hd small{font-size:11px;opacity:.75}
.card{animation:fi .35s both}h1{border-left:6px solid var(--pr);padding-left:10px}
#sp{position:fixed;inset:0;background:#e07819;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;animation:out .5s 1.6s forwards}
#sp img{width:190px;border-radius:24px;animation:pop .9s cubic-bezier(.2,1.4,.4,1)}#sp b{margin-top:14px;font-size:22px;letter-spacing:.25em;color:#17120d;animation:fi .8s .5s both}
@keyframes pop{from{transform:scale(.3) rotate(-14deg);opacity:0}to{transform:none;opacity:1}}
@keyframes out{to{opacity:0;visibility:hidden}}@keyframes fi{from{opacity:0;transform:translateY(8px)}}@keyframes bob{50%{transform:translateY(-5px)}}

<div id="ov"></div><nav class="nav" id="n"></nav>
<script>
const K='psrental.v1',H=['Aim','Feby','Joni'],MG={A:'Aim',B:'Feby',C:'Joni'};
function toast(m){const t=$('ov');t.innerHTML='<div class="mb"><p>'+esc(m)+'</p><button class="big" onclick="$(\'ov\').innerHTML=\'\'">OK</button></div>'}
let _f=null;function ask(m,f){_f=f;$('ov').innerHTML='<div class="mb"><p>'+esc(m)+'</p><div class="row"><button class="s" style="flex:1" onclick="$(\'ov\').innerHTML=\'\'">Batal</button><button style="flex:1" onclick="$(\'ov\').innerHTML=\'\';_f()">Ya</button></div></div>'}
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const fd=s=>new Date(s+'T00:00').toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function seed(){return{units:Array.from({length:12},(_,i)=>{const o=H[Math.floor(i/4)];return{id:'PS-'+String(i+1).padStart(2,'0'),owner:o,holder:o}}),rentals:[],moves:[]}}
function push(){if(!ref)return;lastT=Date.now();ref.set({v:JSON.stringify(S),t:lastT}).then(()=>sy('☁ Tersinkron')).catch(()=>sy('⚠ Gagal sinkron'))}
function load(){let d=null;try{d=JSON.parse(localStorage.getItem(K))}catch(e){}if(!d||!d.units)d=seed();
const m=x=>MG[x]||x;d.units.forEach(u=>{u.owner=m(u.owner);u.holder=m(u.holder)});d.rentals.forEach(r=>r.courier=m(r.courier));d.moves.forEach(x=>{x.from=m(x.from);x.to=m(x.to)});
d.cfg=Object.assign({base:0,extra:10000,min:3},d.cfg||{});return d}
const rp=n=>'Rp'+Math.round(n).toLocaleString('id-ID');
const og=r=>+r.ongkir||0,sog=x=>x.reduce((a,r)=>a+og(r),0);
const price=r=>r.manual!=null?r.manual:(S.cfg.base+S.cfg.extra*Math.max(0,r.dur-S.cfg.min))*r.units.length;
let ref=null,lastT=0;
function sy(t){const e=$('sy');if(e)e.textContent=t}
function save(){S.holders=[...H];push();try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
let S=load();if(S.holders)H.splice(0,3,...S.holders);let tab='dash',date=iso(new Date()),edit=null,draft={units:[],courier:H[0]},mv={units:[],to:H[0]};
const act=ex=>S.rentals.filter(r=>r.status==='AKTIF'&&r.id!==ex);
const busy=ex=>{const s={};act(ex).forEach(r=>r.units.forEach(u=>s[u]=r));return s};
const dayR=()=>S.rentals.filter(r=>r.date===date).sort((a,b)=>a.start.localeCompare(b.start));
const hrs=l=>l.reduce((a,r)=>a+Number(r.dur),0);
function go(t){tab=t;if(t!=='rent')edit=null;render()}
function nav(){$('n').innerHTML=[['dash','🏠','Dashboard'],['rent','➕','Rental'],['unit','🎮','Unit'],['rekap','📊','Rekap']].map(([k,i,l])=>`<button class="${tab===k?'a':''}" onclick="go('${k}')"><span>${i}</span>${l}</button>`).join('')}
const dateBox=()=>`<input type="date" value="${date}" onchange="date=this.value||date;render()">`;
function rcard(r,btns){return`<div class="card"><div class="row sp"><b>${esc(r.name)}</b><span class="tag ${r.status==='AKTIF'?'R':'Y'}">${r.status}</span></div>
<div class="mu">${esc(r.loc)||'-'} · ${fd(r.date)}</div><div>${r.start} · ${r.dur} jam${r.dur>S.cfg.min?` (+${r.dur-S.cfg.min} jam tambahan)`:''} · antar: <b>${r.courier}</b></div><div><b>${rp(price(r))}</b>${r.manual!=null?' <span class="mu">(harga manual)</span>':''}</div><div class="mu">Ongkir ${rp(og(r))} untuk ${r.courier}</div><div class="mu">${r.units.join(', ')}</div>
<div class="row" style="margin-top:8px">${btns}</div></div>`}
const rb=r=>`${r.status==='SELESAI'?`<button class="sm" onclick="reopen('${r.id}')">Buka Lagi</button>`:''}${r.status==='AKTIF'?`<button class="sm" onclick="addH('${r.id}')">+1 Jam</button><button class="ok sm" onclick="done('${r.id}')">Selesai Rental</button>`:''}<button class="s sm" onclick="edt('${r.id}')">Edit</button><button class="d sm" onclick="del('${r.id}')">Hapus</button>`;
function dash(){const l=dayR(),b=busy(),rented=Object.keys(b).length,bk=S.units.filter(u=>u.holder!==u.owner).length;
const cnt=h=>S.units.filter(u=>u.holder===h).length,A=act();
return`<h1>Dashboard</h1>${dateBox()}<div class="grid">
<div class="card stat"><b>${l.length}</b><span>Transaksi</span></div><div class="card stat"><b>${hrs(l)}</b><span>Total jam</span></div>
<div class="card stat"><b>${l.length}</b><span>Pengantaran</span></div><div class="card stat"><b>${bk}</b><span>Unit backup</span></div><div class="card stat" style="grid-column:span 2"><b>${rp(l.reduce((a,r)=>a+price(r),0))}</b><span>Pendapatan tanggal ini</span></div>
<div class="card stat"><b style="color:var(--ok)">${12-rented}</b><span>READY</span></div><div class="card stat"><b style="color:var(--wa)">${rented}</b><span>RENTAL</span></div></div>
<h2>Unit dipegang</h2><div class="g3">${H.map(h=>`<div class="card stat" style="text-align:center"><b>${cnt(h)}</b><span>${h}</span></div>`).join('')}</div>
<h2>Ongkir pengantar</h2><div class="g3">${H.map(h=>{const x=l.filter(r=>r.courier===h);return`<div class="card" style="text-align:center"><b>${h}</b><div>${x.length} antar</div><div class="mu">${hrs(x)} jam</div><div style="color:var(--wa);font-weight:700">${rp(sog(x))}</div></div>`}).join('')}</div>
<h2>Harga</h2><div class="card"><label>Harga paket ${S.cfg.min} jam (per unit)</label><input id="cb" type="number" inputmode="numeric" value="${S.cfg.base}"><label>Tambah per jam (per unit)</label><input id="ce" type="number" inputmode="numeric" value="${S.cfg.extra}"><button class="s" onclick="cfg()">Simpan Harga</button></div>
<h2>Rental aktif (${A.length})</h2>${A.map(r=>rcard(r,rb(r))).join('')||'<p class="mu">Tidak ada rental aktif.</p>'}
<h2>Selesai tanggal ini</h2>${l.filter(r=>r.status==='SELESAI').map(r=>rcard(r,rb(r))).join('')||'<p class="mu">Belum ada.</p>'}`}
function rent(){const r=edit?S.rentals.find(x=>x.id===edit):null,b=busy(edit);
return`<h1>${r?'Edit Rental':'Rental Baru'}</h1>
<label>Nama konsumen</label><input id="fn" value="${esc(r?.name)}" placeholder="Nama">
<label>Lokasi</label><input id="fl" value="${esc(r?.loc)}" placeholder="Alamat / lokasi">
<div class="grid"><div><label>Tanggal</label><input type="date" id="fdt" value="${r?.date||date}"></div><div><label>Jam mulai</label><input type="time" id="fs" value="${r?.start||new Date().toTimeString().slice(0,5)}"></div></div>
<label>Durasi (jam)</label><input type="number" id="fdu" min="3" step="1" inputmode="decimal" value="${r?.dur||''}" placeholder="minimal 3">
<label>Harga total (opsional) — kosongkan untuk harga otomatis</label><input id="fp" type="number" inputmode="numeric" min="0" value="${r?.manual??''}" placeholder="mis. diskon / harga khusus">
<label>Unit PS</label><div class="chips">${S.units.map(u=>`<button class="chip ${draft.units.includes(u.id)?'on':''} ${b[u.id]?'off':''}" ${b[u.id]?'disabled':''} onclick="tu('${u.id}',this)">${u.id}<br><small>${u.holder}</small></button>`).join('')}</div>
<label>Pengantar</label><div class="chips">${H.map(h=>`<button class="chip cc ${draft.courier===h?'on':''}" onclick="draft.courier='${h}';document.querySelectorAll('.cc').forEach(e=>e.classList.toggle('on',e.dataset.h==='${h}'))" data-h="${h}" ${''}>${h}</button>`).join('')}</div>
<label>Ongkir untuk pengantar (Rp)</label><input id="fo" type="number" inputmode="numeric" min="0" value="${r?r.ongkir??'':S.cfg.lastOg??''}" placeholder="mis. 10000">
<div class="chips" style="margin-top:-6px">${[0,5000,10000,15000,20000].map(v=>`<button class="chip" onclick="$('fo').value=${v}">${v?rp(v):'Tanpa ongkir'}</button>`).join('')}</div>
<button class="big" onclick="saveR()">${r?'Simpan Perubahan':'Simpan Rental'}</button>${r?'<button class="big s" style="margin-top:8px" onclick="go(\'dash\')">Batal</button>':''}`}
function tu(id,el){const i=draft.units.indexOf(id);i<0?draft.units.push(id):draft.units.splice(i,1);el.classList.toggle('on')}
function saveR(){const g=i=>$(i).value.trim(),name=g('fn'),dur=parseFloat(g('fdu')),dt=g('fdt'),st=g('fs');
if(dur<S.cfg.min)return toast('Durasi minimal '+S.cfg.min+' jam.');if(!name||!(dur>0)||!dt||!st)return toast('Lengkapi nama, tanggal, jam mulai, dan durasi.');
if(!draft.units.length)return toast('Pilih minimal 1 unit.');
const old=edit?S.rentals.find(x=>x.id===edit):null,b=busy(edit);
if(!old||old.status==='AKTIF'){const c=draft.units.filter(u=>b[u]);if(c.length)return toast('Unit sedang dirental: '+c.join(', '))}
const mp=g('fp'),manual=mp===''?null:parseFloat(mp);if(manual!==null&&!(manual>=0))return toast('Harga tidak valid.');
const og2=Math.max(0,parseFloat(g('fo'))||0);S.cfg.lastOg=og2;
const o={ongkir:og2,manual,id:old?.id||uid(),name,loc:g('fl'),date:dt,start:st,dur,units:[...draft.units],courier:draft.courier,status:old?.status||'AKTIF',created:old?.created||Date.now()};
if(old)Object.assign(old,o);else S.rentals.push(o);
save();date=dt;edit=null;draft={units:[],courier:H[0]};go('dash')}
function edt(id){const r=S.rentals.find(x=>x.id===id);edit=id;draft={units:[...r.units],courier:r.courier};tab='rent';render()}
function addH(id){const r=S.rentals.find(x=>x.id===id);ask('Tambah 1 jam? (+'+rp(S.cfg.extra*r.units.length)+')',()=>{r.dur+=1;if(r.manual!=null)r.manual+=S.cfg.extra*r.units.length;save();render()})}
function cfg(){const b=parseFloat($('cb').value),e=parseFloat($('ce').value);if(!(b>=0)||!(e>=0))return toast('Isi angka harga.');S.cfg.base=b;S.cfg.extra=e;save();render()}
function done(id){ask('Selesaikan rental ini? Unit kembali READY.',()=>{S.rentals.find(x=>x.id===id).status='SELESAI';save();render()})}
let lastDel=null;
function del(id){ask('Hapus transaksi ini? Unit aktif akan kembali READY.',()=>{lastDel=S.rentals.find(x=>x.id===id);S.rentals=S.rentals.filter(x=>x.id!==id);save();render();
$('ov').innerHTML='<div class="mb"><p>Transaksi dihapus.</p><div class="row"><button class="s" style="flex:1" onclick="$(\'ov\').innerHTML=\'\'">OK</button><button style="flex:1" onclick="undoDel()">Urungkan</button></div></div>'})}
function undoDel(){$('ov').innerHTML='';const r=lastDel;if(!r)return;if(r.status==='AKTIF'&&r.units.some(u=>busy()[u]))return toast('Tidak bisa diurungkan: unitnya sudah dipakai rental lain.');S.rentals.push(r);lastDel=null;save();render()}
function reopen(id){const r=S.rentals.find(x=>x.id===id),b=busy(id),c=r.units.filter(u=>b[u]);if(c.length)return toast('Tidak bisa dibuka lagi, unit sedang dirental: '+c.join(', '));
ask('Buka lagi rental ini (jadi AKTIF)?',()=>{r.status='AKTIF';save();render()})}
function unit(){const b=busy();
return`<h1>Status Unit</h1>${S.units.map(u=>{const r=b[u.id],bk=u.holder!==u.owner;
return`<div class="card row sp"><div><b>${u.id}</b> — ${u.holder} ${bk?`<span class="tag bk">backup dari ${u.owner}</span>`:''}${r?`<div class="mu">${esc(r.name)} · ${r.start} · ${r.dur} jam · antar ${r.courier}</div>`:''}</div><span class="tag ${r?'R':'Y'}">${r?'RENTAL':'READY'}</span></div>`}).join('')}
<details class="card"><summary><b>Ubah nama unit &amp; pemegang</b></summary><label style="display:block;margin-top:10px">Nama pemegang</label>${H.map((h,i)=>`<input class="eh" value="${esc(h)}">`).join('')}
<label>Nama unit</label><div class="grid">${S.units.map(u=>`<input class="eu" value="${esc(u.id)}" style="margin:0 0 8px">`).join('')}</div><button class="big" onclick="names()">Simpan Nama</button></details>
<h2>Pindah Unit</h2><div class="card"><label>Pilih unit</label><div class="chips">${S.units.map(u=>`<button class="chip ${mv.units.includes(u.id)?'on':''}" onclick="mu('${u.id}',this)">${u.id}<br><small>${u.holder}</small></button>`).join('')}</div>
<label>Pindah ke</label><select id="mt">${H.map(h=>`<option ${mv.to===h?'selected':''}>${h}</option>`).join('')}</select>
<label>Catatan (opsional)</label><input id="mn" placeholder="Backup karena unit Feby penuh">
<button class="big" onclick="move()">Simpan Perpindahan</button></div>
<h2>Riwayat perpindahan</h2>${[...S.moves].reverse().map(m=>`<div class="card"><b>${fd(m.date)}</b> — ${m.unit} — ${m.from} → ${m.to}${m.note?` — ${esc(m.note)}`:''}</div>`).join('')||'<p class="mu">Belum ada perpindahan.</p>'}`}
function names(){const hs=[...document.querySelectorAll('.eh')].map(e=>e.value.trim()),us=[...document.querySelectorAll('.eu')].map(e=>e.value.trim());
if([...hs,...us].some(x=>!x))return toast('Nama tidak boleh kosong.');
if(new Set(hs).size<hs.length||new Set(us).size<us.length)return toast('Nama tidak boleh sama.');
const hm={},um={};H.forEach((h,i)=>hm[h]=hs[i]);S.units.forEach((u,i)=>um[u.id]=us[i]);const m=x=>hm[x]||x;
S.units.forEach(u=>{u.id=um[u.id];u.owner=m(u.owner);u.holder=m(u.holder)});
S.rentals.forEach(r=>{r.courier=m(r.courier);r.units=r.units.map(i=>um[i]||i)});
S.moves.forEach(x=>{x.from=m(x.from);x.to=m(x.to);x.unit=um[x.unit]||x.unit});
H.splice(0,3,...hs);draft={units:[],courier:H[0]};mv={units:[],to:H[0]};save();render();toast('Nama tersimpan.')}
function mu(id,el){const i=mv.units.indexOf(id);i<0?mv.units.push(id):mv.units.splice(i,1);el.classList.toggle('on')}
function move(){const to=$('mt').value,note=$('mn').value.trim(),l=mv.units.map(i=>S.units.find(u=>u.id===i)).filter(u=>u.holder!==to);
if(!l.length)return toast('Pilih unit yang pemegangnya berbeda dari tujuan.');
l.forEach(u=>{S.moves.push({id:uid(),date:iso(new Date()),ts:Date.now(),unit:u.id,from:u.holder,to,note});u.holder=to});
mv={units:[],to:H[0]};save();render()}
function rekap(){const l=dayR();
return`<h1>Rekap Harian</h1>${dateBox()}<div class="grid"><div class="card stat"><b>${l.length}</b><span>Total rental</span></div><div class="card stat"><b>${hrs(l)}</b><span>Total jam</span></div><div class="card stat" style="grid-column:span 2"><b>${rp(l.reduce((a,r)=>a+price(r),0))}</b><span>Pendapatan</span></div></div>
<h2>Per pengantar (antar &amp; ongkir)</h2><div class="g3">${H.map(h=>{const x=l.filter(r=>r.courier===h);return`<div class="card" style="text-align:center"><b>${h}</b><div>${x.length} antar</div><div class="mu">${hrs(x)} jam</div><div style="color:var(--wa);font-weight:700">${rp(sog(x))}</div></div>`}).join('')}</div>
<div class="card stat"><b>${rp(sog(l))}</b><span>Total ongkir semua pengantar</span></div><button class="big s" onclick="csv()">⬇ Export CSV</button><div id="ex"></div>
<h2>Detail transaksi</h2>${l.map(r=>rcard(r,rb(r))).join('')||'<p class="mu">Tidak ada transaksi pada tanggal ini.</p>'}`}
function csv(){if(!dayR().length)return toast('Tidak ada transaksi pada '+fd(date)+'. Pilih tanggal lain dulu.');const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"',
t=[['Tanggal','Nama konsumen','Lokasi','Unit','Jam mulai','Durasi','Pengantar','Status','Total harga','Ongkir'].map(q).join(',')].concat(dayR().map(r=>[r.date,r.name,r.loc,r.units.join(' '),r.start,r.dur,r.courier,r.status,price(r),og(r)].map(q).join(','))).concat(['',['Pengantar','Jumlah antar','Total jam','Total ongkir'].map(q).join(',')],H.map(h=>{const x=dayR().filter(r=>r.courier===h);return [h,x.length,hrs(x),sog(x)].map(q).join(',')})).join('\n');
const fn='rekap-'+date+'.csv',box=m=>$('ex').innerHTML='<div class="card"><div class="mu">'+m+'</div><textarea rows="6" readonly onclick="this.select()">'+esc(t)+'</textarea></div>';
(async()=>{try{const d=await claude.use('downloads');if(!d)throw 0;await d.save({filename:fn,data:'\ufeff'+t});box('✔ File '+fn+' dikirim. Cadangan teks CSV:')}catch(e){try{navigator.clipboard.writeText(t)}catch(_){}box('Unduhan tidak tersedia. CSV disalin ke clipboard; bisa juga disalin dari sini:')}})();
}
function render(){nav();$('m').innerHTML={dash,rent,unit,rekap}[tab]();window.scrollTo(0,0)}
render();
(async()=>{try{const db=await claude.use('db');if(!db)return;ref=db.doc('app/state');sy('☁ Menyambung…');
const sn=await ref.get();
if(sn.exists){S=JSON.parse(sn.data().v);S.holders&&H.splice(0,3,...S.holders);lastT=sn.data().t;render()}else{push()}
sy('☁ Tersinkron');
ref.onSnapshot(x=>{if(!x.exists)return;const d=x.data();if(d.t===lastT)return;lastT=d.t;S=JSON.parse(d.v);S.holders&&H.splice(0,3,...S.holders);try{localStorage.setItem(K,d.v)}catch(e){}if(tab!=='rent'&&!$('ov').innerHTML)render();sy('☁ Tersinkron')},()=>sy('⚠ Gagal sinkron'))}catch(e){sy('Rental PS · mode lokal')}})();
</script></body></html>
